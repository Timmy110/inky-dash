[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inky-dash"
version = "0.1.0"
description = "Scheduled e-paper dashboard for the Pimoroni Inky Impression 7.3\" (Spectra 6)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.1",
    "pydantic>=2.6",
    "httpx>=0.27",
    "holidays>=0.50",
    "babel>=2.14",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Only on the Pi: the display driver, GPIO for buttons and the LED.
inky = ["inky>=2.1", "gpiod>=2.1", "gpiodevice>=0.1", "numpy"]
# Only on the PC: smart crop for `inky-dash prepare`.
# OpenCV 5 dropped CascadeClassifier (the Haar face detector) from the main package.
prepare = ["opencv-python-headless>=4.8,<5", "numpy"]
heic = ["pillow-heif"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "numpy"]

[project.scripts]
inky-dash = "inkydash.cli:main"

[tool.setuptools.packages.find]
include = ["inkydash*"]

[tool.setuptools.package-data]
inkydash = ["i18n/*.json", "render/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
